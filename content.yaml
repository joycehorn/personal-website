    en: "Fifteen years of shipping and running software (data infrastructure for 60+ court systems, healthcare and fintech platforms, and training hundreds of non-technical users) is why my research tools are built to be used, not just published."
    pt: "Quinze anos entregando e mantendo software (infraestrutura de dados para mais de 60 sistemas judiciais, plataformas de saúde e do setor financeiro, e capacitação de centenas de usuários não técnicos) são o motivo de minhas ferramentas de pesquisa serem feitas para serem usadas, e não apenas publicadas."

