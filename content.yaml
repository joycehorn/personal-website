# ---------------------------------------------------------------------
# Research themes — render IN THIS ORDER.
# ---------------------------------------------------------------------
research_themes:
  - id: hitl
    tag: HUMAN_IN_THE_LOOP
    title:
      en: "AI proposes, experts verify"
      pt: "A IA propõe, especialistas verificam"
    text:
      en: "Pipelines where vision, audio, and language models surface candidate moments in classroom recordings, trained analysts confirm or correct them, and those corrections feed back into the models through active learning and chain-of-thought refinement."
      pt: "Pipelines em que modelos de visão, áudio e linguagem identificam momentos candidatos em gravações de sala de aula, analistas treinados os confirmam ou corrigem, e essas correções retornam aos modelos por meio de aprendizado ativo e refinamento com chain-of-thought."
  - id: llm-eval
    tag: LLM_EVALUATION
    title:
      en: "Knowing when to trust an LLM's reading"
      pt: "Saber quando confiar na leitura de um LLM"
    text:
      en: "Methods for evaluating LLMs as qualitative analysts of multimodal classroom data: where they agree with expert coders, where they diverge, and what that divergence tells us."
      pt: "Métodos para avaliar LLMs como analistas qualitativos de dados multimodais de sala de aula: onde concordam com codificadores especialistas, onde divergem e o que essa divergência revela."
  - id: interfaces
    tag: XAI
    title:
      en: "Interfaces people can interrogate"
      pt: "Interfaces que podem ser questionadas"
    text:
      en: "Visual tools, such as an AI-enhanced timeline of multimodal interactions, that place the evidence next to every AI judgment so researchers and teachers can validate it, override it, and learn from it."
      pt: "Ferramentas visuais, como uma linha do tempo de interações multimodais aprimorada por IA, que colocam a evidência ao lado de cada julgamento da IA para que pesquisadores e professores possam validá-lo, contestá-lo e aprender com ele."
  - id: multimodal
    tag: MULTIMODAL_AI
    title:
      en: "Multimodal and embodied learning"
      pt: "Aprendizagem multimodal e corporificada"
    text:
      en: "Late-fusion and agentic architectures that combine gaze, movement, speech, and gesture to recognize self- and socially-shared regulation of learning in embodied science and computing activities."
      pt: "Arquiteturas de fusão tardia e agênticas que combinam olhar, movimento, fala e gestos para reconhecer a autorregulação e a regulação socialmente compartilhada da aprendizagem em atividades corporificadas de ciências e computação."

