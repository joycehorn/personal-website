      pt: "Um framework modular que combina visão computacional, processamento de áudio e fusão tardia baseada em LLMs para classificar comportamentos de autorregulação e de regulação socialmente compartilhada, refinado continuamente com prompting chain-of-thought e aprendizado ativo a partir de feedback humano."
